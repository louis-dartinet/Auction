<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Deepwoken Draft — Portfolio Demo</title>
<style>
  :root{
    --void:#0a0e0f;
    --panel:#121a1b;
    --panel-raised:#172221;
    --line:#263230;
    --gold:#b9924f;
    --gold-bright:#e0bb7a;
    --verdigris:#5c8b7a;
    --bone:#ddd7c7;
    --dim:#8a938e;
    --rust:#8a3d38;
    --rust-bright:#c1665f;
    --shadow:rgba(0,0,0,.55);
    --font-display:"Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif;
    --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(92,139,122,.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 100%, rgba(185,146,79,.06), transparent 60%),
      var(--void);
    color:var(--bone);
    font-family:var(--font-ui);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--gold-bright);}
  button{font-family:var(--font-ui);cursor:pointer;}
  input, select{font-family:var(--font-ui);}
  ::selection{background:var(--gold);color:#161010;}
  :focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px;}

  .panel{
    background:linear-gradient(180deg, var(--panel-raised), var(--panel));
    border:1px solid var(--line);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.35), 0 8px 24px var(--shadow);
    border-radius:var(--radius);
  }

  /* ---------- App shell ---------- */
  #app{min-height:100vh;display:flex;flex-direction:column;}

  /* ---------- Centered gate screens (role select / login / join) ---------- */
  .gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .gate-card{width:100%;max-width:430px;padding:38px 34px;text-align:center;}
  .sigil{
    width:46px;height:46px;margin:0 auto 18px;
    border:1px solid var(--gold);
    transform:rotate(45deg);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 22px rgba(185,146,79,.25);
  }
  .sigil::before{content:"";width:8px;height:8px;background:var(--gold);transform:rotate(-45deg);}
  .gate h1{
    font-family:var(--font-display);
    font-size:1.9rem;font-weight:600;letter-spacing:.01em;
    margin:0 0 6px;color:var(--bone);
  }
  .gate p.tag{color:var(--dim);font-size:.92rem;margin:0 0 30px;line-height:1.5;}
  .setup-banner{
    background:rgba(138,61,56,.14);border:1px solid var(--rust);color:var(--rust-bright);
    border-radius:var(--radius);padding:14px 16px;font-size:.82rem;line-height:1.5;
    text-align:left;margin-bottom:22px;
  }
  .setup-banner code{background:rgba(0,0,0,.35);padding:1px 5px;border-radius:2px;color:var(--bone);}
  .conn-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--verdigris);}
  .conn-dot.off{background:var(--rust-bright);}
  .stack{display:flex;flex-direction:column;gap:12px;}
  .btn{
    display:block;width:100%;padding:13px 18px;
    background:transparent;border:1px solid var(--line);border-radius:var(--radius);
    color:var(--bone);font-size:.95rem;letter-spacing:.02em;
    transition:border-color .15s ease, background .15s ease;
    text-align:center;
  }
  .btn:hover{border-color:var(--gold);background:rgba(185,146,79,.06);}
  .btn-gold{
    background:var(--gold);border-color:var(--gold);color:#1a1410;font-weight:600;
  }
  .btn-gold:hover{background:var(--gold-bright);border-color:var(--gold-bright);}
  .btn-ghost{border-color:transparent;color:var(--dim);}
  .btn-ghost:hover{border-color:var(--line);color:var(--bone);background:transparent;}
  .btn-sm{padding:8px 12px;font-size:.85rem;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;}
  .btn-row .btn{width:auto;flex:1;}
  .field{text-align:left;margin-bottom:14px;}
  .field label{display:block;font-size:.78rem;color:var(--dim);margin-bottom:6px;letter-spacing:.02em;}
  .field input, .field select{
    width:100%;padding:11px 12px;background:var(--void);border:1px solid var(--line);
    border-radius:var(--radius);color:var(--bone);font-size:.95rem;
  }
  .field input:focus, .field select:focus{border-color:var(--gold);}
  .error-msg{color:var(--rust-bright);font-size:.83rem;margin:-4px 0 14px;min-height:1em;}
  .back-link{display:inline-block;margin-top:22px;color:var(--dim);font-size:.85rem;text-decoration:none;}
  .back-link:hover{color:var(--gold-bright);}

  /* ---------- Header bar ---------- */
  header.top{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:16px 28px;border-bottom:1px solid var(--line);
    background:rgba(10,14,15,.6);
    position:sticky;top:0;z-index:10;backdrop-filter:blur(6px);
  }
  header.top .title{display:flex;align-items:center;gap:12px;}
  header.top .sigil{width:26px;height:26px;margin:0;}
  header.top .sigil::before{width:5px;height:5px;}
  header.top h1{font-family:var(--font-display);font-size:1.15rem;margin:0;font-weight:600;}
  header.top .lot-count{color:var(--dim);font-size:.82rem;margin-top:1px;}
  header.top .who{display:flex;align-items:center;gap:14px;font-size:.85rem;color:var(--dim);}
  header.top .purse{color:var(--gold-bright);font-family:var(--font-display);font-size:1.05rem;}

  main.layout{
    flex:1;display:grid;grid-template-columns:230px minmax(0,1fr) 260px;gap:0;
    max-width:1400px;width:100%;margin:0 auto;
  }
  main.layout.layout-2col{grid-template-columns:minmax(0,1fr) 260px;}
  aside.queue-col, aside.side-col{padding:20px 16px;border-right:1px solid var(--line);}
  aside.side-col{border-right:none;border-left:1px solid var(--line);}
  section.hero-col{padding:28px;min-width:0;}

  .col-heading{
    font-size:.75rem;letter-spacing:.06em;color:var(--dim);margin:0 0 12px;
    padding-bottom:8px;border-bottom:1px solid var(--line);
  }

  /* ---------- Queue ledger ---------- */
  .lot-row{
    display:flex;align-items:center;gap:9px;padding:8px 6px;border-radius:var(--radius);
    font-size:.85rem;cursor:default;
  }
  .lot-row .num{color:var(--dim);font-family:var(--font-display);width:22px;flex-shrink:0;text-align:right;}
  .lot-row .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lot-row.active{background:rgba(185,146,79,.1);}
  .lot-row.active .name{color:var(--gold-bright);font-weight:600;}
  .lot-row.sold{opacity:.42;}
  .lot-row.sold .name{text-decoration:line-through;}
  .lot-row.skipped{opacity:.35;font-style:italic;}
  .lot-row.clickable{cursor:pointer;}
  .lot-row.clickable:hover{background:rgba(255,255,255,.04);}
  .queue-scroll{max-height:calc(100vh - 140px);overflow-y:auto;}

  /* ---------- Hero panel ---------- */
  .hero-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;padding:34px 24px;}
  .frame{position:relative;width:180px;height:180px;margin-bottom:22px;}
  .frame img, .frame .fallback{
    width:100%;height:100%;object-fit:cover;border-radius:2px;
    background:var(--void);display:block;
  }
  .frame .fallback{
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-size:2.6rem;color:var(--gold);
  }
  .frame .corner{position:absolute;width:18px;height:18px;border-color:var(--gold);}
  .frame .corner.tl{top:-6px;left:-6px;border-top:2px solid;border-left:2px solid;}
  .frame .corner.tr{top:-6px;right:-6px;border-top:2px solid;border-right:2px solid;}
  .frame .corner.bl{bottom:-6px;left:-6px;border-bottom:2px solid;border-left:2px solid;}
  .frame .corner.br{bottom:-6px;right:-6px;border-bottom:2px solid;border-right:2px solid;}
  .frame.live .corner{animation:pulseglow 2.4s ease-in-out infinite;}
  @keyframes pulseglow{
    0%,100%{box-shadow:0 0 0 rgba(224,187,122,0);}
    50%{box-shadow:0 0 10px rgba(224,187,122,.75);}
  }
  .lot-label{color:var(--verdigris);font-size:.8rem;letter-spacing:.05em;margin-bottom:6px;}
  .hero-name{font-family:var(--font-display);font-size:2rem;margin:0 0 22px;color:var(--bone);}
  .bid-figures{display:flex;gap:36px;margin-bottom:26px;}
  .bid-figures .item .label{font-size:.75rem;color:var(--dim);margin-bottom:4px;}
  .bid-figures .item .value{font-family:var(--font-display);font-size:1.5rem;color:var(--gold-bright);}
  .bid-figures .item .value.bidder{color:var(--bone);font-size:1.2rem;}
  .empty-hero{padding:60px 20px;text-align:center;color:var(--dim);}
  .empty-hero .sigil{margin-bottom:18px;}
  .empty-hero h2{font-family:var(--font-display);color:var(--bone);font-size:1.4rem;margin:0 0 8px;}

  /* ---------- Bid control blocks ---------- */
  .controls-block{width:100%;max-width:420px;margin-top:6px;}
  .quick-bids{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:14px;}
  .quick-bids button{
    padding:10px 16px;background:transparent;border:1px solid var(--gold);border-radius:var(--radius);
    color:var(--gold-bright);font-size:.88rem;font-weight:600;
  }
  .quick-bids button:hover{background:rgba(185,146,79,.12);}
  .quick-bids button:disabled{border-color:var(--line);color:var(--dim);cursor:not-allowed;background:transparent;}
  .custom-bid-row{display:flex;gap:8px;margin-bottom:6px;}
  .custom-bid-row input{
    flex:1;padding:10px 12px;background:var(--void);border:1px solid var(--line);
    border-radius:var(--radius);color:var(--bone);
  }
  .hint{font-size:.78rem;color:var(--dim);margin-top:4px;}
  .divider-flourish{display:flex;align-items:center;gap:10px;color:var(--line);margin:24px 0;width:100%;max-width:420px;}
  .divider-flourish .ln{flex:1;height:1px;background:var(--line);}
  .divider-flourish .dot{width:5px;height:5px;background:var(--gold);transform:rotate(45deg);}

  .admin-panel{width:100%;max-width:460px;margin-top:8px;padding:20px;text-align:left;}
  .admin-panel .row{display:flex;gap:10px;margin-bottom:10px;}
  .admin-panel .row input, .admin-panel .row select{
    flex:1;padding:9px 10px;background:var(--void);border:1px solid var(--line);
    border-radius:var(--radius);color:var(--bone);font-size:.88rem;
  }
  .admin-panel .row button{white-space:nowrap;}
  .admin-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .admin-actions .btn{flex:1;min-width:120px;}
  .btn-sold{background:var(--verdigris);border-color:var(--verdigris);color:#0d1512;font-weight:600;}
  .btn-sold:hover{filter:brightness(1.12);}
  .btn-next{background:var(--gold);border-color:var(--gold);color:#1a1410;font-weight:600;}
  .btn-next:hover{background:var(--gold-bright);}
  .btn-danger{border-color:var(--rust);color:var(--rust-bright);}
  .btn-danger:hover{background:rgba(138,61,56,.12);border-color:var(--rust-bright);}

  /* ---------- Sold ledger strip ---------- */
  .sold-strip-wrap{margin-top:8px;}
  .sold-strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;}
  .sold-chip{
    flex-shrink:0;width:120px;padding:10px;border:1px solid var(--line);border-radius:var(--radius);
    background:var(--void);text-align:center;
  }
  .sold-chip img{width:44px;height:44px;object-fit:cover;border-radius:2px;margin-bottom:6px;}
  .sold-chip .n{font-size:.78rem;color:var(--bone);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sold-chip .p{font-size:.72rem;color:var(--gold-bright);margin-top:2px;}
  .sold-chip .b{font-size:.68rem;color:var(--dim);}

  /* ---------- Bidders roster ---------- */
  .bidder-row{display:flex;justify-content:space-between;padding:8px 6px;font-size:.85rem;border-radius:var(--radius);}
  .bidder-row.me{background:rgba(185,146,79,.1);}
  .bidder-row .nm{color:var(--bone);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bidder-row .bg{color:var(--dim);font-variant-numeric:tabular-nums;}
  .bidder-row.me .bg{color:var(--gold-bright);}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--panel-raised);border:1px solid var(--gold);color:var(--bone);
    padding:11px 20px;border-radius:var(--radius);font-size:.88rem;
    box-shadow:0 8px 24px var(--shadow);z-index:100;
  }

  /* ---------- Captains' picks board ---------- */
  .rosters-wrap{max-width:1400px;margin:0 auto;padding:26px 28px 40px;border-top:1px solid var(--line);}
  .rosters-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:14px;}
  .roster-col{background:var(--void);border:1px solid var(--line);border-radius:var(--radius);padding:14px;min-width:0;}
  .roster-col .cap-name{font-family:var(--font-display);color:var(--gold-bright);font-size:1rem;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .roster-col .cap-budget{font-size:.75rem;color:var(--dim);margin-bottom:10px;}
  .roster-col .pick{font-size:.82rem;padding:6px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:6px;}
  .roster-col .pick:first-of-type{border-top:none;}
  .roster-col .pick .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .roster-col .pick .pp{color:var(--gold-bright);flex-shrink:0;}
  .roster-col .none{font-size:.78rem;color:var(--dim);font-style:italic;}
  @media (max-width:980px){ .rosters-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:560px){ .rosters-grid{grid-template-columns:1fr;} }

  @media (max-width:980px){
    main.layout{grid-template-columns:1fr;}
    aside.queue-col, aside.side-col{border:none;border-top:1px solid var(--line);}
    section.hero-col{order:-1;}
    .queue-scroll{max-height:260px;}
  }

/* Parchment and charcoal, inspired by the D1 signup panel. */
:root{--panel:#dedfce;--panel-raised:#e9e9db;--line:#a8aa95;--bone:#252b24;--dim:#626855;--gold:#66734d;--gold-bright:#394b2e;--verdigris:#557e61;--void:#10191b;--radius:2px;}
body{background:radial-gradient(ellipse at 15% 0%,#334c49 0,transparent 55%),linear-gradient(135deg,#192729,#0d1517);color:#dddfd0;}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(115deg,transparent 0 90px,#9bac9910 91px 92px);z-index:-1;}
.gate-card{max-width:640px;padding:48px!important;border:12px solid #202621;outline:1px solid #84907b;box-shadow:0 28px 70px #0007;color:var(--bone);}
.panel,.hero-wrap,.queue-col,.side-col,.rosters-wrap,.sold-strip-wrap{color:var(--bone);}
.hero-wrap{background:linear-gradient(145deg,#e5e5d6,#cdcfbd);border:10px solid #202621;outline:1px solid #64725e;padding:30px;}
.queue-col,.side-col,.rosters-wrap,.sold-strip-wrap{background:#d9dbca;padding:20px;border:1px solid #8f987f;}
h1,h2,.hero-name{font-family:var(--font-display);font-weight:500;letter-spacing:-.025em;}
.gate h1{font-size:clamp(36px,6vw,56px);}.hero-name{font-size:clamp(30px,4vw,48px);}
.btn-gold,.btn-next,.btn-sold{background:#35472e!important;color:#f0f0df!important;border-color:#35472e!important;}
.btn{border-radius:2px;}.btn:hover{filter:brightness(1.08);transform:translateY(-1px);}.btn:disabled{opacity:.45;transform:none;cursor:not-allowed;}
.rules-strip{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:24px 0;}.rules-strip span{border:1px solid #9fa58e;padding:7px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.09em;}
.round-clock{margin:22px auto 10px;max-width:430px;text-align:left;}.clock-head{display:flex;align-items:baseline;justify-content:space-between;font-size:11px;letter-spacing:.13em;text-transform:uppercase;}.clock-head strong{font:42px var(--font-display);letter-spacing:0;}.clock-track{height:5px;background:#b1b7a1;margin:8px 0 12px;}.clock-fill{height:100%;background:#456541;transition:width .15s linear;}.round-clock.urgent .clock-fill{background:#ad4a37;}.round-clock.urgent strong{color:#a23829;}.round-clock small{color:#59614d;letter-spacing:0;}
.bid-history{max-width:430px;margin:22px auto 0;text-align:left;border-top:1px solid #a8ad96;padding-top:14px;}.history-row{display:flex;justify-content:space-between;padding:7px 0;font-size:13px;border-bottom:1px solid #afb49e55;}.history-row span{color:#59614d;}.history-row b{font-variant-numeric:tabular-nums;}.admin-actions{flex-wrap:wrap;}.topbar{background:#121c1d;color:#e2e3d4;}.setup-banner{color:#465340!important;background:#cad0b9!important;border-color:#8c977c!important;}.roster-col{background:#e5e6d7!important;}.bidder-row.me{background:#bdc8ac!important;}input,select{color:#232b21!important;background:#f0f0e5!important;border-color:#9ba58c!important;}input::placeholder{color:#7a806d;}.hint{color:#606852;}.col-heading{color:#46553c;}.lot-row.active{background:#b9c5a6;}.value{color:#33472c!important;}.frame .fallback{background:#b5bfa5;color:#33452f;}.toast{background:#202d23!important;color:#e8eadc!important;}.gate-card .sigil{margin-bottom:22px;}
@media(max-width:700px){.gate-card{padding:26px!important;margin:16px;}.hero-wrap{padding:20px;border-width:6px;}.clock-head strong{font-size:34px;}.layout{gap:16px;}.queue-col{max-height:260px;overflow:auto;}}

</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";

/* ============================= CONFIG ============================= */
// Portfolio demo: intentionally disconnected from the original Firebase database.
// All auction data is stored only in this browser (localStorage).
const STARTING_BUDGET = 30000;
const FIREBASE_CONFIGURED = true; // Demo mode is always available.
const DEMO_PREFIX = "deepwoken_draft_v2_";
const db = null;

const USERNAMES = [
"whitedevvv","Kon4218","alfeyzzz","shiyrogane","Veiquiro",
"spawncrystals","rkyc","card","Destroyerheroman","SNKDreazz94",
"ddmewtwo","vxko","smothercloud","KittyOliviaaaaa",
"patopizza456","LyonZ17","Arturek7","boundlessslove","migxvs","Drowze_e",
"crazycarrot455","siilyguyy","RyanMassi2","lIIIlIlllIIIlIlIIIl","predictionmybeloved",
"raulrivitas123","yustin1234567890","emrikfan18","Apollon0200","tommyleekinn",
"Franky2","tekivm","DJ_Aswqe","Vymphia","PositiveKevinn","n5ase",
"g9nklas","Kingdethboyleon","UhhSiiver","Bartek060606","shadow121121121",
"counted"
];

// The 6 team captains who will be bidding. They are not part of the auction
// pool above — this list is only used to build the "Captains' picks" board.
const CAPTAIN_LIMIT = 6;

// The first 6 people who successfully sign up as auctioneers become captains.
const CAPTAINS = [];

/* ============================= DEMO STORAGE ============================= */
// Local-only data: no network database writes and no shared live sessions.
async function sGet(key){
  try { const v = localStorage.getItem(DEMO_PREFIX + key); return v === null ? null : JSON.parse(v); }
  catch(e){ console.warn("Demo storage unavailable", e); return null; }
}
async function sSet(key, value){
  try { localStorage.setItem(DEMO_PREFIX + key, JSON.stringify(value)); return true; }
  catch(e){ console.warn("Demo storage unavailable", e); return false; }
}
function watch(key, onChange){ /* No shared realtime database in portfolio demo. */ }

function fmt(n){ return Math.round(n).toLocaleString("en-US"); }
function esc(s){ const d=document.createElement("div"); d.textContent=s==null?"":String(s); return d.innerHTML.replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function initials(name){ return (name||"?").slice(0,2).toUpperCase(); }

/* ============================= APP STATE ============================= */
const state = {
  screen: "role-select",   // role-select | admin-login | admin-dashboard | bidder-join | bidder-view
  bidderName: null,
  players: [],
  meta: {},
  bidders: {},
  loaded: false,
  toastTimer: null,
  hideEntrants: (function(){ try{ return localStorage.getItem("dw_hideEntrants")==="1"; }catch(e){ return false; } })()
};

function shuffledUsernames(){
  const arr = USERNAMES.slice();
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function defaultPlayers(){
  const order = shuffledUsernames();
  return order.map((u,i)=>({
    id:i, username:u, robloxId:null, avatarUrl:null,
    status: i===0 ? "active" : "pending",
    currentBid: i===0 ? 100 : 0,
    highestBidder: null,
    soldPrice: null, soldTo: null
  }));
}
function defaultMeta(){
  return { startingBid: 100, avatarsResolved:false, captains:[] };
}

async function ensureInit(){
  let players = await sGet("dw_players");
  if(!players || !Array.isArray(players) || players.length !== USERNAMES.length){
    players = defaultPlayers();
    await sSet("dw_players", players);
  }
  let meta = await sGet("dw_meta");
  if(!meta){
    meta = defaultMeta();
    await sSet("dw_meta", meta);
  }else if(!Array.isArray(meta.captains)){
    meta = Object.assign({}, meta, {captains:[]});
    await sSet("dw_meta", meta);
  }
  let bidders = await sGet("dw_bidders");
  if(!bidders){ bidders = {}; await sSet("dw_bidders", bidders); }
  state.players = players; state.meta = meta; state.bidders = bidders;
}

async function refreshAll(){
  const [players, meta, bidders] = await Promise.all([sGet("dw_players"), sGet("dw_meta"), sGet("dw_bidders")]);
  if(players) state.players = players;
  if(meta) state.meta = meta;
  if(bidders) state.bidders = bidders;
}

/* ============================= ROBLOX AVATAR RESOLUTION ============================= */
async function fetchJSON(url, opts){
  const res = await fetch(url, opts||{});
  if(!res.ok) throw new Error("HTTP "+res.status);
  return res.json();
}
async function resolveOneUserId(username){
  try{
    const data = await fetchJSON("https://users.roblox.com/v1/users/search?keyword="+encodeURIComponent(username)+"&limit=10");
    if(data && Array.isArray(data.data) && data.data.length){
      const exact = data.data.find(u => (u.name||"").toLowerCase() === username.toLowerCase());
      return (exact || data.data[0]).id;
    }
  }catch(e){ /* swallow - handled by caller via null */ }
  return null;
}
async function resolveAvatarsIfNeeded(){
  // External avatar fetching is disabled in this standalone portfolio demo.
  return;
}

/* ============================= EVENT DELEGATION ============================= */
let delegated = false;
function attachOnce(){
  if(delegated) return;
  delegated = true;
  document.addEventListener("click", async (e)=>{
    const el = e.target.closest("[data-action]");
    if(!el) return;
    e.preventDefault();
    const action = el.getAttribute("data-action");
    if(el.disabled) return;
    if(action.startsWith("round-") || action==="export-results"){await roundAction(action);return;}
    if(action==="admin-next-lot" && activePlayer()){showToast("Finish or skip the current round first.");return;}
    if(action==="admin-select-lot" && activePlayer() && activePlayer().roundState==="running"){showToast("Pause or finish this round first.");return;}

    if(action === "goto-role-select"){ state.screen="role-select"; state.bidderName=null; render(); }
    else if(action === "goto-admin-login"){ state.screen="admin-login"; render();  }
    else if(action === "goto-bidder-join"){ state.screen="bidder-join"; render(); setTimeout(()=>{const i=document.getElementById("auctioneerNameInput"); if(i) i.focus();},0); }

    else if(action === "submit-admin-login"){
      
      await refreshAll(); state.screen="admin-dashboard"; render();
    }

    else if(action === "signup-auctioneer"){
      const input = document.getElementById("auctioneerNameInput");
      const error = document.getElementById("joinError");
      const name = (input && input.value || "").trim();

      if(!name){
        if(error) error.textContent = "Enter your auctioneer name.";
        return;
      }

      await refreshAll();

      // Re-read the latest captain list before accepting the signup.
      const latestMeta = await sGet("dw_meta") || defaultMeta();
      const captains = Array.isArray(latestMeta.captains)
        ? latestMeta.captains.slice(0, CAPTAIN_LIMIT)
        : [];

      if(captains.length >= CAPTAIN_LIMIT){
        showToast("All 6 captain seats are filled.");
        render();
        return;
      }

      const existing = Object.keys(state.bidders || {});
      if(existing.some(n => n.toLowerCase() === name.toLowerCase())){
        if(error) error.textContent = "That auctioneer has already signed up.";
        return;
      }

      const newCaptains = captains.concat(name).slice(0, CAPTAIN_LIMIT);
      const meta = Object.assign({}, latestMeta, {captains:newCaptains});
      const bidders = Object.assign({}, state.bidders, {
        [name]: { budget: STARTING_BUDGET, won: [] }
      });

      await sSet("dw_meta", meta);
      await sSet("dw_bidders", bidders);

      state.meta = meta;
      state.bidders = bidders;
      state.bidderName = name;
      state.screen = "bidder-view";
      render();
    }

    else if(action === "pick-captain"){
      const name = el.getAttribute("data-name");
      await refreshAll();
      const captains = captainNames();

      if(!captains.some(c => c.toLowerCase() === name.toLowerCase())){
        showToast("That captain seat is no longer available.");
        render();
        return;
      }

      const bidders = Object.assign({}, state.bidders);
      if(!bidders[name]) bidders[name] = { budget: STARTING_BUDGET, won: [] };
      await sSet("dw_bidders", bidders);
      state.bidders = bidders;
      state.bidderName = name;
      state.screen = "bidder-view";
      render();
    }

    else if(action === "admin-select-lot"){
      const id = Number(el.getAttribute("data-id"));
      await refreshAll();
      const players = state.players.map(p=>{
        if(p.status==="active") return Object.assign({}, p, {status:"pending",currentBid:0,highestBidder:null,roundState:"ready",endsAt:null,history:[]});
        if(p.id===id && p.status==="pending") return Object.assign({}, p, {status:"active", currentBid: state.meta.startingBid, highestBidder:null, roundState:"ready", endsAt:null, history:[]});
        return p;
      });
      await sSet("dw_players", players);
      state.players = players;
      rerenderDynamic();
    }

    else if(action === "admin-set-starting-bid"){
      const v = Number((document.getElementById("startingBidInput")||{}).value || 0);
      if(!Number.isSafeInteger(v)||v<0||v>STARTING_BUDGET){showToast("Use whole notes from 0 to 30,000.");return;}
      const meta = Object.assign({}, state.meta, {startingBid: v});
      await sSet("dw_meta", meta);
      state.meta = meta;
      showToast("Opening bid set to "+fmt(v)+" notes");
    }

    else if(action === "admin-set-bid"){
      const amt=Number(document.getElementById("customBidInput").value);
      const who=document.getElementById("assignBidderSelect").value;
      await submitBid(amt,who);
    }

    else if(action === "admin-mark-sold"){
      await refreshAll();const p=activePlayer();
      if(!p || !p.highestBidder){showToast("A winning bid is needed. Skip an unsold lot instead.");return;}
      if(!confirm("Close this round now and sell to "+p.highestBidder+"?"))return;
      await settleRound(p);
    }

    else if(action === "admin-skip-lot"){
      await refreshAll();
      const p = activePlayer();
      if(!p) return;
      const players = state.players.map(pl => pl.id===p.id ? Object.assign({}, pl, {status:"skipped"}) : pl);
      await sSet("dw_players", players);
      state.players = players;
      rerenderDynamic();
    }

    else if(action === "admin-next-lot"){
      await refreshAll();
      const next = state.players.find(p=>p.status==="pending");
      const players = state.players.map(p=>{
        if(p.status==="active") return p; // leave as-is; host should mark sold/skip first
        if(next && p.id===next.id) return Object.assign({}, p, {status:"active", currentBid: state.meta.startingBid, highestBidder:null, roundState:"ready", endsAt:null, history:[]});
        return p;
      });
      await sSet("dw_players", players);
      state.players = players;
      rerenderDynamic();
      if(!next) showToast("No lots remaining.");
    }

    else if(action === "admin-toggle-entrants"){
      state.hideEntrants = !state.hideEntrants;
      try{ localStorage.setItem("dw_hideEntrants", state.hideEntrants ? "1" : "0"); }catch(err){}
      const qEl = document.getElementById("queueBox"); if(qEl) qEl.innerHTML = queueBoxMarkup();
      const btn = document.getElementById("entrantsToggleBtn"); if(btn) btn.textContent = state.hideEntrants ? "Show" : "Hide";
    }

    else if(action === "admin-resolve-avatars"){
      const meta = Object.assign({}, state.meta, {avatarsResolved:false});
      await sSet("dw_meta", meta);
      state.meta = meta;
      showToast("Re-fetching Roblox avatars…");
      resolveAvatarsIfNeeded();
    }

    else if(action === "admin-reset-auction"){
      if(!confirm("Reset the entire draft? All bids, sales, and auctioneer budgets will be cleared. This cannot be undone.")) return;
      if(!confirm("Really sure? This wipes everything back to lot 1.")) return;
      const players = defaultPlayers();
      const meta = defaultMeta();
      await sSet("dw_players", players);
      await sSet("dw_meta", meta);
      await sSet("dw_bidders", {});
      state.players = players; state.meta = meta; state.bidders = {};
      rerenderDynamic();
      resolveAvatarsIfNeeded();
      showToast("Draft reset.");
    }

    else if(action === "bidder-quick-bid"){
      const amt = Number(el.getAttribute("data-amt"));
      await placeBid(amt);
    }
    else if(action === "bidder-custom-bid"){
      const amt = Number((document.getElementById("customBidderAmt")||{}).value || 0);
      if(!amt){ showToast("Enter an amount to bid."); return; }
      await placeBid(amt);
    }
  });
}

// All demo mutations serialize across tabs. A Firebase backend must implement
// these same transitions in an authoritative transaction, not independent writes.
async function locked(fn){
  if(navigator.locks)return navigator.locks.request("deepwoken-v2-round",fn);
  return fn();
}
function clockMarkup(p){
  const seconds=p.roundState==="running"?Math.max(0,Math.ceil((p.endsAt-Date.now())/1000)):(p.remainingMs?Math.ceil(p.remainingMs/1000):20);
  return '<div class="round-clock" id="roundClock"><div class="clock-head"><span id="clockState">'+esc(p.roundState||"Ready to start")+'</span><strong id="clockSeconds">'+seconds+'s</strong></div><div class="clock-track"><div class="clock-fill" id="clockFill"></div></div><small>20-second rounds · late bids restore 5 seconds · budgets start at 30,000</small></div>';
}
function historyMarkup(p){
  return '<div class="bid-history"><div class="col-heading">Bid history</div>'+((p.history||[]).slice(-6).reverse().map(b=>'<div class="history-row"><span>'+esc(b.who)+'</span><b>'+fmt(b.amount)+' notes</b></div>').join('')||'<p class="hint">The floor is open. Waiting for the first bid.</p>')+'</div>';
}
async function savePlayer(p){
  state.players=state.players.map(x=>x.id===p.id?p:x);await sSet("dw_players",state.players);rerenderDynamic();
}
async function submitBid(amt,who){
  return locked(async()=>{
    await refreshAll();const p=activePlayer(),b=state.bidders[who];
    if(!p||p.roundState!=="running"||Date.now()>=p.endsAt){showToast("Bidding is closed or paused.");return;}
    if(!b){showToast("Choose a registered captain.");return;}
    if(who===p.highestBidder){showToast("You already hold the highest bid.");return;}
    const minimum=p.highestBidder?p.currentBid+100:Math.max(100,p.currentBid);
    if(!Number.isSafeInteger(amt)||amt<minimum){showToast("Minimum bid: "+fmt(minimum)+" whole notes.");return;}
    if(amt>b.budget){showToast("This captain has only "+fmt(b.budget)+" notes left.");return;}
    const now=Date.now();
    await savePlayer({...p,currentBid:amt,highestBidder:who,endsAt:Math.max(p.endsAt,now+5000),history:[...(p.history||[]),{who,amount:amt,at:now,previousBid:p.currentBid,previousBidder:p.highestBidder||null}]});
    showToast("Bid accepted: "+fmt(amt)+" notes");
  });
}
async function placeBid(amt){return submitBid(amt,state.bidderName);}
async function settleRound(p){
  // Recompute purses from the sales ledger: settlement is idempotent after reload.
  if(p.status!=="active")return;
  const winner=state.bidders[p.highestBidder];
  if(p.highestBidder&&(!winner||winner.budget<p.currentBid)){await savePlayer({...p,roundState:"paused",remainingMs:5000,endsAt:null});showToast("Sale paused: insufficient budget.");return;}
  const sold=!!p.highestBidder;
  await savePlayer({...p,status:sold?"sold":"skipped",roundState:"closed",endsAt:null,soldTo:sold?p.highestBidder:null,soldPrice:sold?p.currentBid:null});
  await reconcileBudgets();rerenderDynamic();showToast(sold?p.username+" sold to "+p.highestBidder+" for "+fmt(p.currentBid):"No bids — lot unsold.");
}
async function reconcileBudgets(){
  for(const name of Object.keys(state.bidders)){
    const picks=state.players.filter(p=>p.status==="sold"&&p.soldTo===name);
    state.bidders[name]={...state.bidders[name],budget:STARTING_BUDGET-picks.reduce((n,p)=>n+p.soldPrice,0),won:picks.map(p=>p.id)};
  }
  await sSet("dw_bidders",state.bidders);
}
async function roundAction(action){
  if(state.screen!=="admin-dashboard")return;
  if(action==="export-results"){
    const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),players:state.players,captains:state.bidders},null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="deepwoken-results.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return;
  }
  return locked(async()=>{
    await refreshAll();const p=activePlayer();if(!p){showToast("Choose the next lot first.");return;}
    const now=Date.now();
    if(p.roundState==="running"&&now>=p.endsAt){await settleRound(p);return;}
    if(action==="round-start"){
      if(p.roundState==="running")return;
      await savePlayer({...p,roundState:"running",endsAt:now+(p.remainingMs||20000),remainingMs:null});
    }else if(action==="round-pause"){
      if(p.roundState!=="running")return;
      await savePlayer({...p,roundState:"paused",remainingMs:Math.max(1,p.endsAt-now),endsAt:null});
    }else if(action==="round-restart"){
      if(!confirm("Clear this lot's bids and reset it to 20 seconds?"))return;
      await savePlayer({...p,currentBid:state.meta.startingBid,highestBidder:null,history:[],roundState:"ready",endsAt:null,remainingMs:20000});
    }else if(action==="round-undo"){
      const history=[...(p.history||[])],last=history.pop();if(!last){showToast("No bids to undo.");return;}
      await savePlayer({...p,currentBid:last.previousBid,highestBidder:last.previousBidder,history,endsAt:p.roundState==="running"?Math.max(p.endsAt,now+5000):null});showToast("Last bid removed.");
    }
  });
}
let ticking=false;
setInterval(async()=>{
  if(ticking||!state.loaded)return;ticking=true;
  try{
    await locked(async()=>{
      await refreshAll();const p=activePlayer();
      if(p&&p.roundState==="running"&&Date.now()>=p.endsAt)await settleRound(p);
    });
    const p=activePlayer();if(!p)return;
    const seconds=p.roundState==="running"?Math.max(0,Math.ceil((p.endsAt-Date.now())/1000)):Math.ceil((p.remainingMs||20000)/1000);
    const clock=document.getElementById("roundClock"),sec=document.getElementById("clockSeconds"),fill=document.getElementById("clockFill"),label=document.getElementById("clockState");
    if(sec)sec.textContent=seconds+"s";if(fill)fill.style.width=Math.min(100,seconds/20*100)+"%";
    if(label)label.textContent=p.roundState||"Ready to start";if(clock)clock.classList.toggle("urgent",p.roundState==="running"&&seconds<=5);
    refreshQuickBidButtons();
  }finally{ticking=false;}
},150);
window.addEventListener("storage",async e=>{if(e.key&&e.key.startsWith(DEMO_PREFIX)){await refreshAll();rerenderDynamic();}});

/* ============================= INIT & LIVE SYNC ============================= */
async function init(){
  if(!FIREBASE_CONFIGURED){
    render(); // shows the setup banner on the role-select screen
    return;
  }
  await ensureInit();
  await reconcileBudgets();
  state.loaded=true;
  render();
  resolveAvatarsIfNeeded();
  // No cross-device listeners: this is a local-only demonstration.
}
init();

})();
</script>
