<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Deepwoken Draft — Live Auction</title>
<style>
  :root{
    --void:#0a0e0f;
    --panel:#121a1b;
    --panel-raised:#172221;
    --line:#263230;
    --gold:#b9924f;
    --gold-bright:#e0bb7a;
    --verdigris:#5c8b7a;
    --bone:#ddd7c7;
    --dim:#8a938e;
    --rust:#8a3d38;
    --rust-bright:#c1665f;
    --shadow:rgba(0,0,0,.55);
    --font-display:"Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif;
    --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(92,139,122,.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 100%, rgba(185,146,79,.06), transparent 60%),
      var(--void);
    color:var(--bone);
    font-family:var(--font-ui);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--gold-bright);}
  button{font-family:var(--font-ui);cursor:pointer;}
  input, select{font-family:var(--font-ui);}
  ::selection{background:var(--gold);color:#161010;}
  :focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px;}

  .panel{
    background:linear-gradient(180deg, var(--panel-raised), var(--panel));
    border:1px solid var(--line);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.35), 0 8px 24px var(--shadow);
    border-radius:var(--radius);
  }

  /* ---------- App shell ---------- */
  #app{min-height:100vh;display:flex;flex-direction:column;}

  /* ---------- Centered gate screens (role select / login / join) ---------- */
  .gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .gate-card{width:100%;max-width:430px;padding:38px 34px;text-align:center;}
  .sigil{
    width:46px;height:46px;margin:0 auto 18px;
    border:1px solid var(--gold);
    transform:rotate(45deg);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 22px rgba(185,146,79,.25);
  }
  .sigil::before{content:"";width:8px;height:8px;background:var(--gold);transform:rotate(-45deg);}
  .gate h1{
    font-family:var(--font-display);
    font-size:1.9rem;font-weight:600;letter-spacing:.01em;
    margin:0 0 6px;color:var(--bone);
  }
  .gate p.tag{color:var(--dim);font-size:.92rem;margin:0 0 30px;line-height:1.5;}
  .setup-banner{
    background:rgba(138,61,56,.14);border:1px solid var(--rust);color:var(--rust-bright);
    border-radius:var(--radius);padding:14px 16px;font-size:.82rem;line-height:1.5;
    text-align:left;margin-bottom:22px;
  }
  .setup-banner code{background:rgba(0,0,0,.35);padding:1px 5px;border-radius:2px;color:var(--bone);}
  .conn-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--verdigris);}
  .conn-dot.off{background:var(--rust-bright);}
  .stack{display:flex;flex-direction:column;gap:12px;}
  .btn{
    display:block;width:100%;padding:13px 18px;
    background:transparent;border:1px solid var(--line);border-radius:var(--radius);
    color:var(--bone);font-size:.95rem;letter-spacing:.02em;
    transition:border-color .15s ease, background .15s ease;
    text-align:center;
  }
  .btn:hover{border-color:var(--gold);background:rgba(185,146,79,.06);}
  .btn-gold{
    background:var(--gold);border-color:var(--gold);color:#1a1410;font-weight:600;
  }
  .btn-gold:hover{background:var(--gold-bright);border-color:var(--gold-bright);}
  .btn-ghost{border-color:transparent;color:var(--dim);}
  .btn-ghost:hover{border-color:var(--line);color:var(--bone);background:transparent;}
  .btn-sm{padding:8px 12px;font-size:.85rem;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;}
  .btn-row .btn{width:auto;flex:1;}
  .field{text-align:left;margin-bottom:14px;}
  .field label{display:block;font-size:.78rem;color:var(--dim);margin-bottom:6px;letter-spacing:.02em;}
  .field input, .field select{
    width:100%;padding:11px 12px;background:var(--void);border:1px solid var(--line);
    border-radius:var(--radius);color:var(--bone);font-size:.95rem;
  }
  .field input:focus, .field select:focus{border-color:var(--gold);}
  .error-msg{color:var(--rust-bright);font-size:.83rem;margin:-4px 0 14px;min-height:1em;}
  .back-link{display:inline-block;margin-top:22px;color:var(--dim);font-size:.85rem;text-decoration:none;}
  .back-link:hover{color:var(--gold-bright);}

  /* ---------- Header bar ---------- */
  header.top{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:16px 28px;border-bottom:1px solid var(--line);
    background:rgba(10,14,15,.6);
    position:sticky;top:0;z-index:10;backdrop-filter:blur(6px);
  }
  header.top .title{display:flex;align-items:center;gap:12px;}
  header.top .sigil{width:26px;height:26px;margin:0;}
  header.top .sigil::before{width:5px;height:5px;}
  header.top h1{font-family:var(--font-display);font-size:1.15rem;margin:0;font-weight:600;}
  header.top .lot-count{color:var(--dim);font-size:.82rem;margin-top:1px;}
  header.top .who{display:flex;align-items:center;gap:14px;font-size:.85rem;color:var(--dim);}
  header.top .purse{color:var(--gold-bright);font-family:var(--font-display);font-size:1.05rem;}

  main.layout{
    flex:1;display:grid;grid-template-columns:230px minmax(0,1fr) 260px;gap:0;
    max-width:1400px;width:100%;margin:0 auto;
  }
  main.layout.layout-2col{grid-template-columns:minmax(0,1fr) 260px;}
  aside.queue-col, aside.side-col{padding:20px 16px;border-right:1px solid var(--line);}
  aside.side-col{border-right:none;border-left:1px solid var(--line);}
  section.hero-col{padding:28px;min-width:0;}

  .col-heading{
    font-size:.75rem;letter-spacing:.06em;color:var(--dim);margin:0 0 12px;
    padding-bottom:8px;border-bottom:1px solid var(--line);
  }

  /* ---------- Queue ledger ---------- */
  .lot-row{
    display:flex;align-items:center;gap:9px;padding:8px 6px;border-radius:var(--radius);
    font-size:.85rem;cursor:default;
  }
  .lot-row .num{color:var(--dim);font-family:var(--font-display);width:22px;flex-shrink:0;text-align:right;}
  .lot-row .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lot-row.active{background:rgba(185,146,79,.1);}
  .lot-row.active .name{color:var(--gold-bright);font-weight:600;}
  .lot-row.sold{opacity:.42;}
  .lot-row.sold .name{text-decoration:line-through;}
  .lot-row.skipped{opacity:.35;font-style:italic;}
  .lot-row.clickable{cursor:pointer;}
  .lot-row.clickable:hover{background:rgba(255,255,255,.04);}
  .queue-scroll{max-height:calc(100vh - 140px);overflow-y:auto;}

  /* ---------- Hero panel ---------- */
  .hero-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;padding:34px 24px;}
  .frame{position:relative;width:180px;height:180px;margin-bottom:22px;}
  .frame img, .frame .fallback{
    width:100%;height:100%;object-fit:cover;border-radius:2px;
    background:var(--void);display:block;
  }
  .frame .fallback{
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-size:2.6rem;color:var(--gold);
  }
  .frame .corner{position:absolute;width:18px;height:18px;border-color:var(--gold);}
  .frame .corner.tl{top:-6px;left:-6px;border-top:2px solid;border-left:2px solid;}
  .frame .corner.tr{top:-6px;right:-6px;border-top:2px solid;border-right:2px solid;}
  .frame .corner.bl{bottom:-6px;left:-6px;border-bottom:2px solid;border-left:2px solid;}
  .frame .corner.br{bottom:-6px;right:-6px;border-bottom:2px solid;border-right:2px solid;}
  .frame.live .corner{animation:pulseglow 2.4s ease-in-out infinite;}
  @keyframes pulseglow{
    0%,100%{box-shadow:0 0 0 rgba(224,187,122,0);}
    50%{box-shadow:0 0 10px rgba(224,187,122,.75);}
  }
  .lot-label{color:var(--verdigris);font-size:.8rem;letter-spacing:.05em;margin-bottom:6px;}
  .hero-name{font-family:var(--font-display);font-size:2rem;margin:0 0 22px;color:var(--bone);}
  .bid-figures{display:flex;gap:36px;margin-bottom:26px;}
  .bid-figures .item .label{font-size:.75rem;color:var(--dim);margin-bottom:4px;}
  .bid-figures .item .value{font-family:var(--font-display);font-size:1.5rem;color:var(--gold-bright);}
  .bid-figures .item .value.bidder{color:var(--bone);font-size:1.2rem;}
  .empty-hero{padding:60px 20px;text-align:center;color:var(--dim);}
  .empty-hero .sigil{margin-bottom:18px;}
  .empty-hero h2{font-family:var(--font-display);color:var(--bone);font-size:1.4rem;margin:0 0 8px;}

  /* ---------- Bid control blocks ---------- */
  .controls-block{width:100%;max-width:420px;margin-top:6px;}
  .quick-bids{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:14px;}
  .quick-bids button{
    padding:10px 16px;background:transparent;border:1px solid var(--gold);border-radius:var(--radius);
    color:var(--gold-bright);font-size:.88rem;font-weight:600;
  }
  .quick-bids button:hover{background:rgba(185,146,79,.12);}
  .quick-bids button:disabled{border-color:var(--line);color:var(--dim);cursor:not-allowed;background:transparent;}
  .custom-bid-row{display:flex;gap:8px;margin-bottom:6px;}
  .custom-bid-row input{
    flex:1;padding:10px 12px;background:var(--void);border:1px solid var(--line);
    border-radius:var(--radius);color:var(--bone);
  }
  .hint{font-size:.78rem;color:var(--dim);margin-top:4px;}
  .divider-flourish{display:flex;align-items:center;gap:10px;color:var(--line);margin:24px 0;width:100%;max-width:420px;}
  .divider-flourish .ln{flex:1;height:1px;background:var(--line);}
  .divider-flourish .dot{width:5px;height:5px;background:var(--gold);transform:rotate(45deg);}

  .admin-panel{width:100%;max-width:460px;margin-top:8px;padding:20px;text-align:left;}
  .admin-panel .row{display:flex;gap:10px;margin-bottom:10px;}
  .admin-panel .row input, .admin-panel .row select{
    flex:1;padding:9px 10px;background:var(--void);border:1px solid var(--line);
    border-radius:var(--radius);color:var(--bone);font-size:.88rem;
  }
  .admin-panel .row button{white-space:nowrap;}
  .admin-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .admin-actions .btn{flex:1;min-width:120px;}
  .btn-sold{background:var(--verdigris);border-color:var(--verdigris);color:#0d1512;font-weight:600;}
  .btn-sold:hover{filter:brightness(1.12);}
  .btn-next{background:var(--gold);border-color:var(--gold);color:#1a1410;font-weight:600;}
  .btn-next:hover{background:var(--gold-bright);}
  .btn-danger{border-color:var(--rust);color:var(--rust-bright);}
  .btn-danger:hover{background:rgba(138,61,56,.12);border-color:var(--rust-bright);}

  /* ---------- Sold ledger strip ---------- */
  .sold-strip-wrap{margin-top:8px;}
  .sold-strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;}
  .sold-chip{
    flex-shrink:0;width:120px;padding:10px;border:1px solid var(--line);border-radius:var(--radius);
    background:var(--void);text-align:center;
  }
  .sold-chip img{width:44px;height:44px;object-fit:cover;border-radius:2px;margin-bottom:6px;}
  .sold-chip .n{font-size:.78rem;color:var(--bone);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sold-chip .p{font-size:.72rem;color:var(--gold-bright);margin-top:2px;}
  .sold-chip .b{font-size:.68rem;color:var(--dim);}

  /* ---------- Bidders roster ---------- */
  .bidder-row{display:flex;justify-content:space-between;padding:8px 6px;font-size:.85rem;border-radius:var(--radius);}
  .bidder-row.me{background:rgba(185,146,79,.1);}
  .bidder-row .nm{color:var(--bone);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bidder-row .bg{color:var(--dim);font-variant-numeric:tabular-nums;}
  .bidder-row.me .bg{color:var(--gold-bright);}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--panel-raised);border:1px solid var(--gold);color:var(--bone);
    padding:11px 20px;border-radius:var(--radius);font-size:.88rem;
    box-shadow:0 8px 24px var(--shadow);z-index:100;
  }

  /* ---------- Captains' picks board ---------- */
  .rosters-wrap{max-width:1400px;margin:0 auto;padding:26px 28px 40px;border-top:1px solid var(--line);}
  .rosters-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:14px;}
  .roster-col{background:var(--void);border:1px solid var(--line);border-radius:var(--radius);padding:14px;min-width:0;}
  .roster-col .cap-name{font-family:var(--font-display);color:var(--gold-bright);font-size:1rem;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .roster-col .cap-budget{font-size:.75rem;color:var(--dim);margin-bottom:10px;}
  .roster-col .pick{font-size:.82rem;padding:6px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:6px;}
  .roster-col .pick:first-of-type{border-top:none;}
  .roster-col .pick .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .roster-col .pick .pp{color:var(--gold-bright);flex-shrink:0;}
  .roster-col .none{font-size:.78rem;color:var(--dim);font-style:italic;}
  @media (max-width:980px){ .rosters-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:560px){ .rosters-grid{grid-template-columns:1fr;} }

  @media (max-width:980px){
    main.layout{grid-template-columns:1fr;}
    aside.queue-col, aside.side-col{border:none;border-top:1px solid var(--line);}
    section.hero-col{order:-1;}
    .queue-scroll{max-height:260px;}
  }

/* Parchment and charcoal, inspired by the D1 signup panel. */
:root{--panel:#dedfce;--panel-raised:#e9e9db;--line:#a8aa95;--bone:#252b24;--dim:#626855;--gold:#66734d;--gold-bright:#394b2e;--verdigris:#557e61;--void:#10191b;--radius:2px;}
body{background:radial-gradient(ellipse at 15% 0%,#334c49 0,transparent 55%),linear-gradient(135deg,#192729,#0d1517);color:#dddfd0;}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(115deg,transparent 0 90px,#9bac9910 91px 92px);z-index:-1;}
.gate-card{max-width:640px;padding:48px!important;border:12px solid #202621;outline:1px solid #84907b;box-shadow:0 28px 70px #0007;color:var(--bone);}
.panel,.hero-wrap,.queue-col,.side-col,.rosters-wrap,.sold-strip-wrap{color:var(--bone);}
.hero-wrap{background:linear-gradient(145deg,#e5e5d6,#cdcfbd);border:10px solid #202621;outline:1px solid #64725e;padding:30px;}
.queue-col,.side-col,.rosters-wrap,.sold-strip-wrap{background:#d9dbca;padding:20px;border:1px solid #8f987f;}
h1,h2,.hero-name{font-family:var(--font-display);font-weight:500;letter-spacing:-.025em;}
.gate h1{font-size:clamp(36px,6vw,56px);}.hero-name{font-size:clamp(30px,4vw,48px);}
.btn-gold,.btn-next,.btn-sold{background:#35472e!important;color:#f0f0df!important;border-color:#35472e!important;}
.btn{border-radius:2px;}.btn:hover{filter:brightness(1.08);transform:translateY(-1px);}.btn:disabled{opacity:.45;transform:none;cursor:not-allowed;}
.rules-strip{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:24px 0;}.rules-strip span{border:1px solid #9fa58e;padding:7px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.09em;}
.round-clock{margin:22px auto 10px;max-width:430px;text-align:left;}.clock-head{display:flex;align-items:baseline;justify-content:space-between;font-size:11px;letter-spacing:.13em;text-transform:uppercase;}.clock-head strong{font:42px var(--font-display);letter-spacing:0;}.clock-track{height:5px;background:#b1b7a1;margin:8px 0 12px;}.clock-fill{height:100%;background:#456541;transition:width .15s linear;}.round-clock.urgent .clock-fill{background:#ad4a37;}.round-clock.urgent strong{color:#a23829;}.round-clock small{color:#59614d;letter-spacing:0;}
.bid-history{max-width:430px;margin:22px auto 0;text-align:left;border-top:1px solid #a8ad96;padding-top:14px;}.history-row{display:flex;justify-content:space-between;padding:7px 0;font-size:13px;border-bottom:1px solid #afb49e55;}.history-row span{color:#59614d;}.history-row b{font-variant-numeric:tabular-nums;}.admin-actions{flex-wrap:wrap;}.top{background:#121c1d;color:#e2e3d4;}.top .lot-count,.top h1{color:#e2e3d4;}.setup-banner{color:#465340!important;background:#cad0b9!important;border-color:#8c977c!important;}.roster-col{background:#e5e6d7!important;}.bidder-row.me{background:#bdc8ac!important;}input,select{color:#232b21!important;background:#f0f0e5!important;border-color:#9ba58c!important;}input::placeholder{color:#7a806d;}.hint{color:#606852;}.col-heading{color:#46553c;}.lot-row.active{background:#b9c5a6;}.value{color:#33472c!important;}.frame .fallback{background:#b5bfa5;color:#33452f;}.toast{background:#202d23!important;color:#e8eadc!important;}.gate-card .sigil{margin-bottom:22px;}
@media(max-width:700px){.gate-card{padding:26px!important;margin:16px;}.hero-wrap{padding:20px;border-width:6px;}.clock-head strong{font-size:34px;}.layout{gap:16px;}.queue-col{max-height:260px;overflow:auto;}}

</style>

  const bidders={};
  for(const [uid,b] of Object.entries(raw?.bidders||{}))bidders[b.name]={...b,uid};
  const players=Object.values(raw?.players||{}).map(p=>({...p,highestBidder:p.highestBidder||null,history:historyFromAudit(p)})).sort((a,b)=>a.id-b.id);
  return {players,meta:{...(raw?.meta||defaultMeta()),captains:Object.keys(bidders)},bidders};
}
function encode(model){
  const players={},bidders={};
  for(const p of model.players){const {history,...plain}=p;players[p.id]=plain;}
  for(const [name,b] of Object.entries(model.bidders)){const {uid,won,...plain}=b;bidders[uid]={...plain,name};}
  const {captains,...meta}=model.meta;
  return JSON.parse(JSON.stringify({players,bidders,meta}));
}
function applyRaw(raw){
  const model=decode(raw);state.players=model.players;state.meta=model.meta;state.bidders=model.bidders;
  const mine=Object.entries(state.bidders).find(([name,b])=>b.uid===currentUser?.uid);
  if(mine)state.bidderName=mine[0];
  state.loaded=!!raw;
}
function historyFromAudit(p){
  let previous=p.openingBid||100,previousBidder=null;
  return (p.audit||"").split("\n").filter(Boolean).map(line=>{
    const [amount,uid,at]=line.split("|");
    const who=Object.values(state.bidders||{}).find(b=>b.uid===uid)?.name||uid.slice(0,8);
    const bid={amount:Number(amount),who,uid,at:Number(at),previousBid:previous,previousBidder};
    previous=bid.amount;previousBidder=who;return bid;
  });
}
async function refreshAll(){if(!sessionRef)return;applyRaw((await sessionRef.get()).val());}
function hostRequired(){if(!isHost)throw Error("This account is not a host.");if(!connected||!clockReady)throw Error("Wait for the live connection.");}
async function hostMutate(fn){
  hostRequired();let reason="";
  const result=await sessionRef.transaction(raw=>{
    if(!raw){reason="Initialise the draft first.";return;}
    const model=decode(raw);const outcome=fn(model,serverNow());
    if(outcome===false)return;
    return encode(model);
  },undefined,false);
  if(result.committed)applyRaw(result.snapshot.val());
  else if(reason)throw Error(reason);
  rerenderDynamic();return result.committed;
}
function reconcile(model){
  for(const [name,b] of Object.entries(model.bidders)){
    const picks=model.players.filter(p=>p.status==="sold"&&p.soldTo===name);
    b.budget=STARTING_BUDGET-picks.reduce((n,p)=>n+p.soldPrice,0);
  }
}
function initialiseModel(){
  return {players:defaultPlayers().map(p=>({...p,roundState:"ready",audit:"",openingBid:p.currentBid||100})),meta:{...defaultMeta(),registrationOpen:true},bidders:{}};
}
function activeIn(model){return model.players.find(p=>p.status==="active");}
function settle(model,p){
  if(!p||p.status!=="active")return;
  if(p.highestBidder){
    const b=model.bidders[p.highestBidder];
    if(!b||b.budget<p.currentBid){p.roundState="paused";p.remainingMs=5000;p.endsAt=null;return;}
    p.status="sold";p.soldTo=p.highestBidder;p.soldPrice=p.currentBid;
  }else p.status="skipped";
  p.roundState="closed";p.endsAt=null;reconcile(model);
}
function resetLot(p,opening){Object.assign(p,{status:"active",currentBid:opening,openingBid:opening,highestBidder:null,highestBidderUid:null,roundState:"ready",endsAt:null,remainingMs:20000,audit:"",previousBid:opening,previousBidder:null});}

async function fetchJSON(url, opts){
  const res = await fetch(url, opts||{});
  if(!res.ok) throw new Error("HTTP "+res.status);
  return res.json();
}
async function resolveOneUserId(username){
  try{
    const data = await fetchJSON("https://users.roblox.com/v1/users/search?keyword="+encodeURIComponent(username)+"&limit=10");
    if(data && Array.isArray(data.data) && data.data.length){
      const exact = data.data.find(u => (u.name||"").toLowerCase() === username.toLowerCase());
      return (exact || data.data[0]).id;
    }
  }catch(e){ /* swallow - handled by caller via null */ }
  return null;
}

/* Shared database mutations: bids transact one lot; hosts transact the whole ledger. */
let delegated=false,busy=false;
function attachOnce(){
 if(delegated)return;delegated=true;
 document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-action]');if(!el||el.disabled)return;e.preventDefault();
  const action=el.dataset.action;
  if(busy)return;busy=true;
  try{await handleAction(action,el);}catch(err){showToast(friendlyError(err));console.error(err);}finally{busy=false;}
 });
}
function friendlyError(err){
 const code=String(err.code||err.message||'');
 if(code.includes('operation-not-allowed'))return 'Enable Anonymous in Firebase Authentication → Sign-in method.';
 if(code.toLowerCase().includes('permission_denied')||code.includes('permission-denied'))return 'Firebase rejected this action. Check the new database rules and your host permission.';
 return err.message||'Could not complete that action.';
}
async function handleAction(action,el){
 if(action==='goto-role-select'){state.screen='role-select';render();return;}
 if(action==='goto-admin-login'){state.screen='admin-login';render();return;}
 if(action==='goto-bidder-join'){state.screen='bidder-join';render();return;}
 if(action==='submit-admin-login'){
  hostRequired();
  const initial=encode(initialiseModel());
  const result=await sessionRef.transaction(raw=>raw?undefined:initial,undefined,false);
  if(result.committed)applyRaw(result.snapshot.val());else await refreshAll();
  state.screen='admin-dashboard';render();return;
 }
 if(action==='signup-auctioneer'){
  if(!currentUser||!connected)throw Error('Wait for the live connection.');
  if(!state.loaded||!state.meta.registrationOpen)throw Error('The host has not opened captain signups yet.');
  const name=document.getElementById('auctioneerNameInput').value.trim();
  if(!/^[A-Za-z0-9 _-]{1,30}$/.test(name)||['__proto__','constructor','prototype'].includes(name))throw Error('Use 1–30 letters, numbers, spaces, underscores or hyphens.');
  await db.ref(ROOT+'/requests/'+currentUser.uid).set({name,createdAt:firebase.database.ServerValue.TIMESTAMP});
  state.screen='bidder-join';render();return;
 }
 if(action==='enter-draft'){
  const mine=Object.entries(state.bidders).find(([n,b])=>b.uid===currentUser?.uid);
  if(!mine)throw Error('The host has not approved your seat yet.');
  state.bidderName=mine[0];state.screen='bidder-view';render();return;
 }
 if(action==='approve-captain'){
  const uid=el.dataset.uid,request=requests[uid];if(!request)throw Error('Request no longer exists.');
  await hostMutate(model=>{
   if(Object.values(model.bidders).some(b=>b.uid===uid))return false;
   if(Object.keys(model.bidders).length>=6)throw Error('All six captain seats are filled.');
   if(Object.keys(model.bidders).some(n=>n.toLowerCase()===request.name.toLowerCase()))throw Error('That captain name is already taken.');
   model.bidders[request.name]={name:request.name,uid,budget:STARTING_BUDGET};
  });showToast('Captain approved.');return;
 }
 if(action==='export-results'){
  hostRequired();const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),players:state.players,captains:state.bidders},null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='deepwoken-results.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return;
 }
 if(action==='admin-toggle-entrants'){state.hideEntrants=!state.hideEntrants;rerenderDynamic();const btn=document.getElementById('entrantsToggleBtn');if(btn)btn.textContent=state.hideEntrants?'Show':'Hide';return;}
 if(action==='bidder-quick-bid'){await submitBid(Number(el.dataset.amt));return;}
 if(action==='bidder-custom-bid'){await submitBid(Number(document.getElementById('customBidderAmt').value));return;}
 if(action==='admin-set-bid'){throw Error('Captains submit their own bids from their browser.');}
 const opening=Number(document.getElementById('startingBidInput')?.value||0);
 if(action==='admin-reset-auction'&&!confirm('Reset this draft? Captains keep their seats; all picks and bids are cleared. Export results first.'))return;
 if(action==='round-restart'&&!confirm('Clear this lot’s bids and reset its clock to 20 seconds?'))return;
 if(action==='admin-mark-sold'&&!confirm('Close the current round and sell to the highest bidder now?'))return;
 await hostMutate((model,now)=>{
  let p=activeIn(model);
  if(p?.roundState==='running'&&now>=p.endsAt){settle(model,p);p=null;}
  if(action==='admin-set-starting-bid'){
   if(!Number.isSafeInteger(opening)||opening<100||opening>30000)throw Error('Opening bid must be 100–30,000 whole notes.');
   model.meta.startingBid=opening;return;
  }
  if(action==='toggle-registration'){model.meta.registrationOpen=!model.meta.registrationOpen;return;}
  if(action==='admin-reset-auction'){
   model.players=initialiseModel().players;model.meta.startingBid=100;reconcile(model);return;
  }
  if(action==='admin-select-lot'||action==='admin-next-lot'){
   if(p)throw Error('Finish or skip the current lot first.');
   const next=action==='admin-next-lot'?(model.players.find(p=>p.status==='pending')||model.players.find(p=>p.status==='skipped')):model.players.find(p=>p.id===Number(el.dataset.id)&&p.status==='pending');
   if(!next)throw Error('No available lots.');resetLot(next,model.meta.startingBid);return;
  }
  if(!p)throw Error('Choose the next lot first.');
  if(action==='round-start'){
   if(p.roundState==='running')return false;
   p.roundState='running';p.endsAt=now+(p.remainingMs||20000);p.remainingMs=null;
  }else if(action==='round-pause'){
   if(p.roundState!=='running')return false;
   p.remainingMs=Math.max(1,p.endsAt-now);p.roundState='paused';p.endsAt=null;
  }else if(action==='round-restart')resetLot(p,p.openingBid||model.meta.startingBid);
  else if(action==='round-undo'){
   const lines=(p.audit||'').split('\n').filter(Boolean);if(!lines.length)throw Error('No bids to undo.');
   lines.pop();p.audit=lines.length?lines.join('\n')+'\n':'';
   const last=lines.at(-1)?.split('|');
   p.currentBid=last?Number(last[0]):p.openingBid;
   p.highestBidderUid=last?last[1]:null;
   p.highestBidder=last?Object.keys(model.bidders).find(n=>model.bidders[n].uid===last[1]):null;
   const prev=lines.at(-2)?.split('|');p.previousBid=prev?Number(prev[0]):p.openingBid;
   p.previousBidder=prev?Object.keys(model.bidders).find(n=>model.bidders[n].uid===prev[1]):null;
   if(p.roundState==='running')p.endsAt=Math.max(p.endsAt,now+5000);
  }else if(action==='admin-mark-sold'){
   if(!p.highestBidder)throw Error('No winning bid. Skip the lot instead.');settle(model,p);
  }else if(action==='admin-skip-lot'){p.status='skipped';p.roundState='closed';p.endsAt=null;}
 });
}
async function submitBid(amt){
 if(!currentUser||!connected||!clockReady)throw Error('Wait for the live connection.');
 const mine=Object.entries(state.bidders).find(([n,b])=>b.uid===currentUser.uid);
 if(!mine)throw Error('A host-approved captain seat is required.');
 const p=activePlayer();if(!p)throw Error('No active lot.');
 let reason='The round changed. Try again.';
 const result=await sessionRef.child('players/'+p.id).transaction(lot=>{
  const now=serverNow();
  if(!lot||lot.status!=='active'||lot.roundState!=='running'||now>=lot.endsAt){reason='Bidding is closed or paused.';return;}
  if(lot.highestBidderUid===currentUser.uid){reason='You already hold the highest bid.';return;}
  const min=lot.highestBidder?lot.currentBid+100:Math.max(100,lot.currentBid);
  if(!Number.isSafeInteger(amt)||amt<min){reason='Minimum bid: '+fmt(min)+' whole notes.';return;}
  if(amt>mine[1].budget){reason='You only have '+fmt(mine[1].budget)+' notes left.';return;}
  const end=Math.max(lot.endsAt,now+5000);
  return {...lot,currentBid:amt,highestBidder:mine[0],highestBidderUid:currentUser.uid,endsAt:end,previousBid:lot.currentBid,previousBidder:lot.highestBidder||null,audit:(lot.audit||'')+amt+'|'+currentUser.uid+'|'+end+'\n'};
 },undefined,false);
 if(!result.committed)throw Error(reason);
 showToast('Bid accepted: '+fmt(amt)+' notes');
}
function clockMarkup(p){
 return '<div class="round-clock" id="roundClock"><div class="clock-head"><span id="clockState">'+esc(p.roundState||'ready')+'</span><strong id="clockSeconds">20s</strong></div><div class="clock-track"><div class="clock-fill" id="clockFill"></div></div><small>20-second rounds · late bids restore 5 seconds · minimum raise 100 notes</small></div>';
}
function historyMarkup(p){
 return '<div class="bid-history"><div class="col-heading">Bid history</div>'+((p.history||[]).slice(-6).reverse().map(b=>'<div class="history-row"><span>'+esc(b.who)+'</span><b>'+fmt(b.amount)+' notes</b></div>').join('')||'<p class="hint">Waiting for the first bid.</p>')+'</div>';
}
let settling=false;
setInterval(async()=>{
 const p=activePlayer();if(!p)return;
 const now=serverNow(),seconds=p.roundState==='running'?Math.max(0,Math.ceil((p.endsAt-now)/1000)):Math.ceil((p.remainingMs||20000)/1000);
 const sec=document.getElementById('clockSeconds'),fill=document.getElementById('clockFill'),label=document.getElementById('clockState'),clock=document.getElementById('roundClock');
 if(sec)sec.textContent=seconds+'s';if(fill)fill.style.width=Math.min(100,seconds/20*100)+'%';
 if(label)label.textContent=!connected?'Reconnecting…':p.roundState==='running'&&now>=p.endsAt?'Closed · awaiting sale':p.roundState||'Ready';
 if(clock)clock.classList.toggle('urgent',p.roundState==='running'&&seconds<=5);refreshQuickBidButtons();
 if(isHost&&connected&&clockReady&&!settling&&p.roundState==='running'&&now>=p.endsAt){
  settling=true;try{await hostMutate((m,t)=>{const lot=activeIn(m);if(lot?.roundState==='running'&&t>=lot.endsAt)settle(m,lot);else return false;});}
  catch(err){showToast(friendlyError(err));}finally{settling=false;}
 }
},200);
async function init(){
 render();
 try{
  if(typeof firebase==='undefined')throw Error('Firebase could not load. Check your internet connection.');
  firebase.initializeApp(firebaseConfig);auth=firebase.auth();db=firebase.database();sessionRef=db.ref(ROOT+'/session');
  db.ref('.info/serverTimeOffset').on('value',snap=>{offset=Number(snap.val()||0);clockReady=true;});
  db.ref('.info/connected').on('value',snap=>{connected=!!snap.val();if(state.screen==='role-select')render();refreshQuickBidButtons();});
  auth.onAuthStateChanged(async user=>{
   if(unsubSession){unsubSession();unsubSession=null;}
   currentUser=user;isHost=false;requests={};state.players=[];state.bidders={};state.meta={};state.loaded=false;state.bidderName=null;state.screen='role-select';setupError='';
   if(!user){
    render();
    try{await auth.signInAnonymously();}catch(err){setupError=friendlyError(err);render();}
    return;
   }
   try{
    isHost=(await db.ref('auctionHosts/'+user.uid).get()).val()===true;
    const sessionHandler=snap=>{
     applyRaw(snap.val());
     // History names resolve after the bidder directory has been applied.
     state.players=state.players.map(p=>({...p,history:historyFromAudit(p)}));
     if(state.screen==='role-select'||state.screen==='bidder-join'||state.screen==='admin-login')render();else rerenderDynamic();
    };
    const errorHandler=err=>{setupError=friendlyError(err);render();};
    sessionRef.on('value',sessionHandler,errorHandler);
    const requestRef=isHost?db.ref(ROOT+'/requests'):db.ref(ROOT+'/requests/'+user.uid);
    const requestHandler=snap=>{requests=isHost?(snap.val()||{}):{[user.uid]:snap.val()};if(!isHost&&!snap.val())requests={};if(state.screen==='bidder-join')render();else rerenderDynamic();};
    requestRef.on('value',requestHandler,errorHandler);
    unsubSession=()=>{sessionRef.off('value',sessionHandler);requestRef.off('value',requestHandler);};
   }catch(err){setupError=friendlyError(err);}
   render();
  });
 }catch(err){setupError=friendlyError(err);render();}
}
init();

})();
